<h2>Booking History</h2>

@if(bookings().length === 0){

  <p>No bookings found</p>

}
@else {

  <table>

    <thead>
      <tr>
        <th>Booking Id</th>
        <th>Date</th>
        <th>Slot</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody>

      @for(booking of bookings(); track booking.id){

        <tr>

          <td>{{ booking.id }}</td>

          <td>{{ booking.bookingDate }}</td>

          <td>{{ booking.slot }}</td>

          <td>{{ booking.status }}</td>

        </tr>

      }

    </tbody>

  </table>

}
